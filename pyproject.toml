[project]
name = "storeel-studio"
version = "0.1.0"
description = "Turn a talking-head video, or an idea you record, into a captioned vertical reel with Meta's Model API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "httpx>=0.28",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.3",
    "pillow>=12.0",
    "python-dotenv>=1.2",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = ["ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storeel"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings: prompts and captions contain typographic quotes
]
